<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07152B"/>
      <stop offset="50%" stop-color="#0E2342"/>
      <stop offset="100%" stop-color="#050C17"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <circle cx="400" cy="400" r="300" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="8 8" opacity="0.15"/>
  <circle cx="400" cy="400" r="240" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.2"/>

  <!-- Star Insignia Top -->
  <g transform="translate(400, 140)">
    <polygon points="0,-25 7,-7 25,-7 11,4 16,22 0,11 -16,22 -11,4 -25,-7 -7,-7" fill="url(#goldGrad)"/>
  </g>

  <!-- Stylized Dignitary Silhouette -->
  <!-- Shoulders & Suit -->
  <path d="M160 880 C 180 700, 260 620, 400 620 C 540 620, 620 700, 640 880 Z" fill="url(#suitGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- White Shirt & Tie -->
  <polygon points="360,620 440,620 420,720 380,720" fill="#FFFFFF"/>
  <polygon points="390,630 410,630 415,750 400,780 385,750" fill="url(#goldGrad)"/>

  <!-- Neck -->
  <rect x="365" y="490" width="70" height="140" rx="10" fill="#CBD5E1"/>

  <!-- Head Outline -->
  <ellipse cx="400" cy="410" rx="110" ry="140" fill="#E2E8F0"/>
  
  <!-- Hair Silhouette -->
  <path d="M285 390 C 285 270, 340 240, 400 240 C 460 240, 515 270, 515 390 C 500 310, 460 270, 400 270 C 340 270, 300 310, 285 390 Z" fill="#475569"/>

  <!-- Military & Medical Badges on Silhouette Chest -->
  <g transform="translate(250, 700)">
    <rect x="0" y="0" width="60" height="15" rx="3" fill="#D4AF37" opacity="0.8"/>
    <rect x="0" y="20" width="60" height="15" rx="3" fill="#B91C1C" opacity="0.8"/>
    <rect x="0" y="40" width="60" height="15" rx="3" fill="#047857" opacity="0.8"/>
  </g>

  <!-- Golden Frame Borders -->
  <rect x="30" y="30" width="740" height="940" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>
  <rect x="45" y="45" width="710" height="910" rx="15" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.2"/>

  <!-- Bottom Crest & Text -->
  <text x="400" y="900" font-family="'Cinzel', serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
    BRIGADIER GENERAL
  </text>
  <text x="400" y="935" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="600" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">
    DR. A.K.M. NASIR UDDIN (RETD.)
  </text>
</svg>
